name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: |
          python -m coverage run --branch -m pytest
          python -m coverage report --fail-under=100

  changes:
    runs-on: ubuntu-latest
    outputs:
      codebase: ${{ steps.diff.outputs.codebase }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect MCP codebase changes
        id: diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "codebase=true" >> "$GITHUB_OUTPUT"
            echo "No base commit. The image will be built."
            exit 0
          fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "codebase=true" >> "$GITHUB_OUTPUT"
            echo "Base commit unavailable. The image will be built."
            exit 0
          fi
          git diff --name-only "$base" HEAD > changed-files.txt
          echo "Files changed since ${base}:"
          cat changed-files.txt
          if grep -Eq '^(plaid_mcp/|Dockerfile$|pyproject.toml$)' changed-files.txt; then
            echo "codebase=true" >> "$GITHUB_OUTPUT"
          else
            echo "codebase=false" >> "$GITHUB_OUTPUT"
            echo "MCP codebase unchanged. No image will be built or published."
          fi

  build:
    needs: [test, changes]
    if: needs.changes.outputs.codebase == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          provenance: false
          tags: plaid-mcp:ci

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.codebase == 'true' && needs.build.result == 'success'
    needs: [build, changes]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read version
        id: version
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re
          import tomllib

          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise SystemExit(f"version is not semver: {version}")
          changelog = pathlib.Path("CHANGELOG.md").read_text()
          if not re.search(rf"^## {re.escape(version)}\s*$", changelog, re.MULTILINE):
              raise SystemExit(f"CHANGELOG.md has no heading for {version}")
          owner = os.environ["GITHUB_REPOSITORY_OWNER"].lower()
          image = f"ghcr.io/{owner}/plaid-mcp"
          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"version={version}\nimage={image}\n")
          PY
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Refuse an existing version tag
        run: |
          image="${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}"
          if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            echo "Image tag ${{ steps.version.outputs.version }} already exists. Bump the version."
            exit 1
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.image }}:latest
      - name: Tag the commit
        run: |
          version="${{ steps.version.outputs.version }}"
          if git rev-parse "v${version}" >/dev/null 2>&1; then
            echo "git tag v${version} already exists"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v${version}"
          git push origin "v${version}"
